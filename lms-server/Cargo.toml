[package]
name = "lms-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Async runtime
tokio = { workspace = true, features = ["process", "io-util"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client for model server communication and downloads
reqwest = { version = "0.11", features = ["stream", "json"] }
futures-util = "0.3"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# File system and paths
walkdir = "2.4"
dirs = "5.0"

# Async utilities
async-trait = "0.1"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Configuration
config = "0.13"

# Path expansion
shellexpand = "3.1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "uuid", "migrate"] }
chrono = "0.4"

# Vector operations (SQLite-based, no external server needed)
bincode = "1.3"  # Efficient binary serialization for embeddings

# Document parsing (TODO: Add back when system dependencies available)
# pdf-extract = "0.7"      # Requires GTK/GDK system libraries
# lopdf = "0.32"           # Alternative PDF parser
# docx-rs = "0.4"          # Requires additional dependencies
# html2text = "0.12"       # Requires libsoup
# scraper = "0.19"         # Requires libsoup

# Text processing
# tiktoken-rs = "0.5"      # TODO: Add back when needed for token counting
unicode-segmentation = "1.11"

# Multipart form data
multer = "3.0"
bytes = "1.5"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
hyper = "1.0"
http-body-util = "0.1"
tempfile = "3.8"
axum-test = "14.0"
