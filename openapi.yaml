openapi: 3.0.3
info:
  title: LMStudio Clone API
  description: |
    OpenAI-compatible API for running large language models locally.

    ## Authentication

    API key authentication is optional. When enabled (via `LMS_API_KEY` or `LMS_API_KEYS` environment variables),
    all requests must include one of:
    - `Authorization: Bearer <api_key>` header
    - `X-API-Key: <api_key>` header

    ## Features

    - **OpenAI Compatible**: Drop-in replacement for OpenAI client libraries
    - **RAG Support**: Upload documents and query with citations
    - **Workspace Isolation**: Organize projects with separate document/chat contexts
    - **Local First**: Complete privacy, offline operation
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: LMStudio Clone
    url: https://github.com/Frosty1442/lmstudio-clone

servers:
  - url: http://localhost:1234
    description: Local development server

tags:
  - name: OpenAI Compatible
    description: OpenAI-compatible endpoints for chat, completions, and embeddings
  - name: Models
    description: Model management (load, unload, download)
  - name: Workspaces
    description: Workspace management for project isolation
  - name: Documents
    description: Document upload and management for RAG
  - name: Chat Sessions
    description: Chat session and message history
  - name: RAG
    description: Retrieval Augmented Generation with citations
  - name: System
    description: Health checks and server status

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Returns server health status. Does not require authentication.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.1.0

  /v1/status:
    get:
      tags: [System]
      summary: Server status
      description: Returns detailed server status including loaded models and uptime.
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatus'

  /v1/models:
    get:
      tags: [OpenAI Compatible]
      summary: List models (OpenAI compatible)
      description: Returns a list of available models in OpenAI API format.
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                          example: model
                        created:
                          type: integer
                        owned_by:
                          type: string
                          example: local

  /v1/chat/completions:
    post:
      tags: [OpenAI Compatible]
      summary: Create chat completion
      description: Creates a chat completion using the specified model. Supports streaming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: Server-sent events for streaming responses

  /v1/completions:
    post:
      tags: [OpenAI Compatible]
      summary: Create text completion
      description: Creates a text completion for the given prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
      responses:
        '200':
          description: Completion response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    example: text_completion
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                        index:
                          type: integer
                        finish_reason:
                          type: string

  /v1/embeddings:
    post:
      tags: [OpenAI Compatible]
      summary: Create embeddings
      description: Creates embedding vectors for the given input text(s).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Embedding response
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        object:
                          type: string
                          example: embedding
                        embedding:
                          type: array
                          items:
                            type: number
                        index:
                          type: integer
                  model:
                    type: string
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                      total_tokens:
                        type: integer

  /v1/models/list:
    get:
      tags: [Models]
      summary: List all models with details
      description: Returns detailed information about all available models.
      responses:
        '200':
          description: List of models with details
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'

  /v1/models/load:
    post:
      tags: [Models]
      summary: Load a model
      description: Loads a model into memory for inference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadModelRequest'
      responses:
        '200':
          description: Model loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  model_id:
                    type: string

  /v1/models/unload:
    post:
      tags: [Models]
      summary: Unload a model
      description: Unloads a model from memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              properties:
                model_id:
                  type: string
      responses:
        '200':
          description: Model unloaded successfully

  /v1/models/download:
    post:
      tags: [Models]
      summary: Download a model
      description: Downloads a model from HuggingFace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadModelRequest'
      responses:
        '200':
          description: Download started

  /v1/models/{id}/stats:
    get:
      tags: [Models]
      summary: Get model statistics
      description: Returns statistics for a specific model.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelStats'

  /v1/workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
    post:
      tags: [Workspaces]
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '200':
          description: Workspace created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  workspace:
                    $ref: '#/components/schemas/Workspace'

  /v1/workspaces/{id}:
    get:
      tags: [Workspaces]
      summary: Get workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace details
    patch:
      tags: [Workspaces]
      summary: Update workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated
    delete:
      tags: [Workspaces]
      summary: Delete workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace deleted

  /v1/workspaces/{id}/stats:
    get:
      tags: [Workspaces]
      summary: Get workspace statistics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace statistics

  /v1/workspaces/{id}/documents:
    get:
      tags: [Documents]
      summary: List documents in workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of documents
    post:
      tags: [Documents]
      summary: Upload document
      description: Upload a document to the workspace for RAG processing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '200':
          description: Document uploaded and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  document:
                    $ref: '#/components/schemas/UploadDocumentResponse'

  /v1/workspaces/{workspace_id}/documents/{document_id}:
    get:
      tags: [Documents]
      summary: Get document
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document details
    delete:
      tags: [Documents]
      summary: Delete document
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document deleted

  /v1/workspaces/{id}/chat:
    post:
      tags: [RAG]
      summary: RAG chat with citations
      description: Query the workspace documents and get a response with citations.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAGRequest'
      responses:
        '200':
          description: RAG response with citations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    $ref: '#/components/schemas/RAGResponse'

  /v1/workspaces/{id}/sessions:
    get:
      tags: [Chat Sessions]
      summary: List chat sessions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of chat sessions
    post:
      tags: [Chat Sessions]
      summary: Create chat session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        '200':
          description: Chat session created

  /v1/workspaces/{workspace_id}/sessions/{session_id}:
    get:
      tags: [Chat Sessions]
      summary: Get chat session
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chat session details
    delete:
      tags: [Chat Sessions]
      summary: Delete chat session
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chat session deleted

  /v1/workspaces/{workspace_id}/sessions/{session_id}/messages:
    get:
      tags: [Chat Sessions]
      summary: Get chat session with messages
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chat session with messages
    post:
      tags: [Chat Sessions]
      summary: Add message to chat session
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, content]
              properties:
                role:
                  type: string
                  enum: [user, assistant, system]
                content:
                  type: string
      responses:
        '200':
          description: Message added

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "API key via Authorization: Bearer <key>"
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key via X-API-Key header

  schemas:
    ServerStatus:
      type: object
      properties:
        running:
          type: boolean
        loaded_models:
          type: array
          items:
            type: string
        uptime:
          type: integer
          description: Server uptime in seconds
        version:
          type: string

    Model:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        size:
          type: integer
        quantization:
          type: string
        loaded:
          type: boolean
        format:
          type: string
          enum: [gguf, ggml, safetensors]

    ModelStats:
      type: object
      properties:
        model_id:
          type: string
        loaded:
          type: boolean
        memory_usage:
          type: integer
        tokens_per_second:
          type: number
        time_to_first_token:
          type: integer
        context_usage:
          type: integer
        max_context:
          type: integer

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Model ID to use
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
        max_tokens:
          type: integer
        stop:
          type: array
          items:
            type: string

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer

    CompletionRequest:
      type: object
      required: [model, prompt]
      properties:
        model:
          type: string
        prompt:
          type: string
        stream:
          type: boolean
          default: false
        temperature:
          type: number
        top_p:
          type: number
        max_tokens:
          type: integer

    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    LoadModelRequest:
      type: object
      required: [model_id]
      properties:
        model_id:
          type: string
        config:
          $ref: '#/components/schemas/ModelConfig'

    ModelConfig:
      type: object
      properties:
        context_size:
          type: integer
          default: 4096
        gpu_layers:
          type: integer
          default: 32
        threads:
          type: integer
          default: 4
        batch_size:
          type: integer
          default: 512

    DownloadModelRequest:
      type: object
      required: [repo]
      properties:
        repo:
          type: string
          description: HuggingFace repository (e.g., "TheBloke/Llama-2-7B-GGUF")
        filename:
          type: string
        quantization:
          type: string

    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        model_id:
          type: string
        embedding_model_id:
          type: string
        temperature:
          type: number
        max_tokens:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        model_id:
          type: string
        embedding_model_id:
          type: string
        temperature:
          type: number
        max_tokens:
          type: integer

    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        model_id:
          type: string
        embedding_model_id:
          type: string
        temperature:
          type: number
        max_tokens:
          type: integer

    UploadDocumentRequest:
      type: object
      required: [filename, content]
      properties:
        filename:
          type: string
          description: Original filename (e.g., "report.pdf")
        content:
          type: string
          description: Base64 encoded content for binary files, plain text for .txt
        file_type:
          type: string
          description: Override detected file type (pdf, docx, txt, md)

    UploadDocumentResponse:
      type: object
      properties:
        document_id:
          type: string
        chunks_created:
          type: integer
        status:
          type: string
          enum: [ready, processing, error]

    RAGRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: The question to ask
        filters:
          $ref: '#/components/schemas/SearchFilters'
        top_k:
          type: integer
          default: 5
          description: Number of chunks to retrieve
        temperature:
          type: number
        max_tokens:
          type: integer

    SearchFilters:
      type: object
      properties:
        document_ids:
          type: array
          items:
            type: string
          description: Filter by specific document IDs
        file_types:
          type: array
          items:
            type: string
          description: Filter by file types (pdf, docx, txt)
        page_range:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: "[min_page, max_page] for PDF page filtering"
        date_range:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
          description: "[start_date, end_date] ISO 8601 timestamps"

    RAGResponse:
      type: object
      properties:
        content:
          type: string
          description: The generated answer
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        chunks_retrieved:
          type: integer
        model_id:
          type: string
        tokens_used:
          type: integer

    Citation:
      type: object
      properties:
        id:
          type: string
          description: Citation ID (e.g., "[1]")
        document_id:
          type: string
        document_name:
          type: string
        page_number:
          type: integer
        char_range:
          type: array
          items:
            type: integer
          description: "[start, end] character positions"
        score:
          type: number
          description: Relevance score (0-1)
        text:
          type: string
          description: The cited chunk text

security:
  - BearerAuth: []
  - ApiKeyHeader: []
